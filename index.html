<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>✨ عيد ميلاد سعيد</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5d78e;--rose:#ff8fb1;--ink:#fff7ea;--head:'Aref Ruqaa','Amiri',serif;--body:'Amiri',Georgia,serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--body);color:var(--ink);background:radial-gradient(ellipse at 50% 120%,#5b2a64 0,#2a1a4a 45%,#0d0b24 100%)}
#sky,#fx{position:fixed;inset:0;width:100%;height:100%}
#fx{pointer-events:none;z-index:30}
#stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
text-align:center;padding:24px 22px;max-width:520px;margin:0 auto}
.step{animation:in .9s both;width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.97)}}
.out{animation:out .5s forwards}@keyframes out{to{opacity:0;transform:translateY(-20px)}}
h1,h2{font-family:var(--head);color:var(--gold);font-weight:700;text-shadow:0 0 22px rgba(245,215,142,.5)}
h1{font-size:clamp(2.2rem,10vw,3.4rem);line-height:1.4}h2{font-size:clamp(1.7rem,7vw,2.3rem)}
p{font-size:1.3rem;line-height:1.9;opacity:.92}
.btn{font-family:var(--head);font-size:1.3rem;color:#2a1a4a;background:linear-gradient(135deg,var(--gold),#ffb8cf);border:0;
padding:12px 34px;border-radius:40px;cursor:pointer;box-shadow:0 0 24px rgba(245,215,142,.45);transition:transform .2s}
.btn:hover{transform:scale(1.06)}.btn:active{transform:scale(.94)}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.hint{font-size:1rem;opacity:.6;animation:pl 2s infinite}@keyframes pl{50%{opacity:.2}}
.moon{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#f5d78e 60%,#d9b46a);
box-shadow:0 0 50px 12px rgba(245,215,142,.4);animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px)}}

/* constellation */
.con{width:min(88vw,380px);aspect-ratio:1;position:relative}
.con svg{width:100%;height:100%;overflow:visible}
.ln{stroke:var(--gold);stroke-width:.6;opacity:0;transition:opacity 1s;stroke-linecap:round}.ln.on{opacity:.9}
.hf{fill:rgba(255,143,177,0);transition:fill 2s}.hf.on{fill:rgba(255,143,177,.25)}
.st{cursor:pointer}.st circle.c{fill:#fff;opacity:.7;animation:tw 2s infinite}
.st circle.g{fill:var(--gold);opacity:.25;animation:tw 2s infinite}
.st.on circle.c{fill:var(--gold);opacity:1}.st.on circle.g{opacity:.55}
@keyframes tw{50%{opacity:.25}}
.msg{min-height:92px;font-family:var(--head);font-size:1.35rem;color:var(--ink);line-height:1.8;padding:0 6px}

/* cake */
.cake{position:relative;width:230px;height:210px;margin-top:20px}
.t{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px 14px 8px 8px}
.t1{bottom:0;width:230px;height:70px;background:linear-gradient(#ff9ebc,#e0658e)}
.t2{bottom:70px;width:170px;height:58px;background:linear-gradient(#fff0f4,#ffc4d6)}
.t3{bottom:128px;width:110px;height:44px;background:linear-gradient(#ffe9b3,#f5c46a)}
.t:before{content:"";position:absolute;left:0;right:0;top:0;height:14px;border-radius:14px 14px 0 0;
background:radial-gradient(circle at 10px 100%,#fff 9px,transparent 10px) repeat-x/20px 14px}
.nm{position:absolute;bottom:20px;width:100%;font-family:var(--head);color:#7a2e4c;font-size:1.2rem}
.cds{position:absolute;bottom:170px;left:50%;transform:translateX(-50%);display:flex;gap:12px}
.cd{width:9px;height:34px;background:repeating-linear-gradient(45deg,#fff,#fff 6px,var(--rose) 6px,var(--rose) 12px);border-radius:3px;position:relative;cursor:pointer}
.fl{position:absolute;left:50%;top:-24px;width:14px;height:22px;margin-left:-7px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;
background:radial-gradient(circle at 50% 75%,#fff6a8,#ffb23c 60%,#ff6a2c);box-shadow:0 0 18px 6px rgba(255,170,60,.6);
animation:fk .25s infinite alternate;transform-origin:50% 100%;transition:opacity .4s,transform .4s}
@keyframes fk{to{transform:scale(.9,1.1) rotate(4deg)}}
.cd.off .fl{opacity:0;transform:scale(.1) translateY(-14px)}

/* memories stack */
.stack{position:relative;width:min(72vw,290px);aspect-ratio:3/4;margin:6px 0 10px;touch-action:pan-y}
.mc{position:absolute;inset:0;background:#fffaf0;padding:12px 12px 52px;border-radius:6px;box-shadow:0 14px 34px rgba(0,0,0,.5);
transition:transform .6s cubic-bezier(.2,.9,.3,1.2),opacity .5s;cursor:pointer;color:#4a2c4a}
.mc img{width:100%;height:100%;object-fit:cover;border-radius:3px;background:#ccc;pointer-events:none}
.mc b{position:absolute;bottom:12px;left:0;right:0;font-family:var(--head);font-size:1.25rem}

/* final */
textarea{width:100%;max-width:340px;height:76px;border-radius:16px;border:1px solid var(--gold);background:rgba(255,255,255,.08);
color:var(--ink);font:1.2rem var(--body);padding:12px;resize:none;outline:none;text-align:center}
.lan{position:fixed;z-index:20;bottom:-140px;width:84px;text-align:center;animation:rise 9s ease-in forwards;pointer-events:none}
.lan i{display:block;height:92px;border-radius:40% 40% 18% 18%;background:linear-gradient(#ffd27a,#ff8a3c);
box-shadow:0 0 40px 14px rgba(255,170,70,.55);font-style:normal;color:#5a2200;font-size:.8rem;line-height:1.2;padding:26px 6px 0;overflow:hidden}
@keyframes rise{to{transform:translate(var(--dx),-120vh) rotate(var(--r));opacity:.15}}
</style>
</head>

  ],
  LETTER:"كل سنة وإنتي أجمل وأقرب لقلبي.\nإنتي مش بس حبيبتي، إنتي أمان وبيت وأحلى صدفة حصلت في حياتي.\nعيد ميلاد سعيد يا أغلى ما عندي. ❤️"

/* =============================== */

const $=s=>document.querySelector(s),st=$('#stage');
const nl=t=>t.replace(/\n/g,'<br>');
const steps=[intro,constellation,cake,memories,finale];let cur=0;

function go(n){
  const old=st.firstElementChild;
  const show=()=>{cur=n;st.innerHTML='';steps[n]()};
  if(old){old.classList.add('out');setTimeout(show,450)}else show();
}
const view=h=>{st.innerHTML=`<div class="step">${h}</div>`;return st.firstElementChild};

/* 1 */
function intro(){
  const v=view(`<div class="moon"></div><h1>كل سنة وإنتي طيبة<br>${C.NAME}</h1><p>${nl(C.INTRO)}</p>
  <button class="btn" id="b">ابدئي الرحلة</button>`);
  $('#b').onclick=()=>{shoot();go(1)};
}

/* 2 */
function constellation(){
  const P=[[50,32],[32,16],[12,34],[26,64],[50,88],[74,64],[88,34],[68,16]];
  const n=Math.min(C.STARS.length,P.length),pts=P.slice(0,n),lit=new Set();
  let lines='';
  pts.forEach((p,i)=>{const q=pts[(i+1)%n];lines+=`<line class="ln" id="l${i}" x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}"/>`});
  const stars=pts.map((p,i)=>`<g class="st" data-i="${i}"><circle class="g" cx="${p[0]}" cy="${p[1]}" r="6"/><circle class="c" cx="${p[0]}" cy="${p[1]}" r="2.4"/><circle cx="${p[0]}" cy="${p[1]}" r="9" fill="transparent"/></g>`).join('');
  view(`<h2>لمسي النجوم ✨</h2><div class="con"><svg viewBox="0 0 100 100">
  <polygon class="hf" id="hf" points="${pts.map(p=>p.join(',')).join(' ')}"/>${lines}${stars}</svg></div>
  <div class="msg" id="m"><span class="hint">كل نجمة بتحكي حكاية…</span></div><div id="nx" style="min-height:52px"></div>`);
  document.querySelectorAll('.st').forEach(g=>g.onclick=()=>{
    const i=+g.dataset.i;g.classList.add('on');lit.add(i);
    $('#m').innerHTML=nl(C.STARS[i]);
    [i,(i+n-1)%n].forEach(k=>lit.has(k)&&lit.has((k+1)%n)&&$('#l'+k).classList.add('on'));
    sparkle(g.getBoundingClientRect());
    if(lit.size==n){$('#hf').classList.add('on');setTimeout(()=>{$('#nx').innerHTML='<button class="btn" id="b">كمّلي</button>';$('#b').onclick=()=>go(2)},900)}
  });
}

/* 3 */
function cake(){
  const k=Math.min(C.AGE,8);let left=k;
  view(`<h2>${nl(C.WISH_TEXT)}</h2><div class="cake"><div class="cds">${'<div class="cd"><div class="fl"></div></div>'.repeat(k)}</div>
  <div class="t t3"></div><div class="t t2"></div><div class="t t1"><div class="nm">${C.NAME}</div></div></div>
  <p class="hint" id="h">المسي الشمع عشان تطفيه</p><div id="nx" style="min-height:52px"></div>`);
  document.querySelectorAll('.cd').forEach(c=>c.onclick=()=>{
    if(c.classList.contains('off'))return;c.classList.add('off');left--;
    if(!left){$('#h').textContent='🎉 أمنيتك في السما دلوقتي!';confetti();
      setTimeout(()=>{$('#nx').innerHTML='<button class="btn" id="b">شوفي ذكرياتنا</button>';$('#b').onclick=()=>go(3)},1200)}
  });
}

/* 4 */
function memories(){
  let order=C.MEMORIES.map((_,i)=>i);
  view(`<h2>ذكرياتنا 💫</h2><div class="stack" id="sk">${C.MEMORIES.map(m=>`<div class="mc"><img src="${m[0]}" alt=""><b>${m[1]}</b></div>`).join('')}</div>
  <p class="hint">المسي الصورة عشان تقلبيها</p><button class="btn" id="b">كمّلي</button>`);
  const cards=[...document.querySelectorAll('.mc')];
  const lay=()=>order.forEach((ci,pos)=>{const c=cards[ci];c.style.zIndex=99-pos;
    c.style.transform=`translateY(${pos*8}px) rotate(${pos?((ci%2?1:-1)*(pos*3+1)):-2}deg) scale(${1-pos*.04})`;c.style.opacity=pos>3?0:1});
  lay();
  cards.forEach(c=>c.onclick=()=>{
    const top=cards[order[0]];if(c!==top)return;
    c.style.transform='translateX(130%) rotate(25deg)';c.style.opacity=0;
    setTimeout(()=>{order.push(order.shift());lay()},350);
  });
  $('#b').onclick=()=>go(4);
}

/* 5 */
function finale(){
  view(`<h1>كل سنة وإنتي حبيبتي</h1><p>${nl(C.LETTER)}</p><p style="font-family:var(--head);color:var(--gold)">— ${C.FROM}</p>
  <textarea id="w" placeholder="اكتبي أمنيتك وأطلقيها في السما 🏮"></textarea>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn" id="r">أطلقي الفانوس 🏮</button>
  <button class="btn ghost" id="a">ارجعي من الأول</button></div>`);
  $('#r').onclick=()=>{
    const w=$('#w').value.trim()||'♥';
    for(let i=0;i<3;i++)setTimeout(()=>{const l=document.createElement('div');l.className='lan';
      l.style.cssText=`left:${15+Math.random()*60}vw;--dx:${Math.random()*80-40}px;--r:${Math.random()*16-8}deg`;
      l.innerHTML=`<i>${i?'♥':w.slice(0,40)}</i>`;document.body.appendChild(l);setTimeout(()=>l.remove(),9200)},i*500);
    confetti(60);
  };
  $('#a').onclick=()=>go(0);
  confetti(80);
}

/* ===== sky ===== */
const sk=$('#sky'),sx=sk.getContext('2d'),fx=$('#fx'),fc=fx.getContext('2d');
let W,H,S=[],sh=[],parts=[];
function rs(){W=sk.width=fx.width=innerWidth;H=sk.height=fx.height=innerHeight;
  S=Array.from({length:Math.round(W*H/5000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,p:Math.random()*6,s:Math.random()*2+.5}))}
addEventListener('resize',rs);rs();
function shoot(){sh.push({x:W*(.4+Math.random()*.6),y:Math.random()*H*.3,l:0})}
setInterval(()=>Math.random()<.5&&shoot(),3500);
function sparkle(r){for(let i=0;i<14;i++)parts.push({x:r.left+r.width/2,y:r.top+r.height/2,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,g:0,life:40,c:'#f5d78e',s:2})}
function confetti(n=140){const cs=['#f5d78e','#ff8fb1','#fff','#b8a1ff','#8fe3ff'];
  for(let i=0;i<n;i++)parts.push({x:W/2,y:H*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*14-3,g:.28,life:110+Math.random()*50,c:cs[i%5],s:Math.random()*5+3})}
(function loop(t){
  sx.clearRect(0,0,W,H);
  S.forEach(s=>{sx.globalAlpha=.4+.6*Math.abs(Math.sin(t/1000*s.s+s.p));sx.fillStyle='#fff';sx.beginPath();sx.arc(s.x,s.y,s.r,0,6.3);sx.fill()});
  sx.globalAlpha=1;
  sh=sh.filter(s=>{s.l+=1;s.x-=9;s.y+=5;const g=sx.createLinearGradient(s.x,s.y,s.x+90,s.y-50);
    g.addColorStop(0,'#fff');g.addColorStop(1,'transparent');sx.strokeStyle=g;sx.lineWidth=2;sx.beginPath();sx.moveTo(s.x,s.y);sx.lineTo(s.x+90,s.y-50);sx.stroke();return s.l<70});
  fc.clearRect(0,0,W,H);
  parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.99;p.life--;fc.globalAlpha=Math.min(1,p.life/30);fc.fillStyle=p.c;fc.fillRect(p.x,p.y,p.s,p.s);return p.life>0});
  requestAnimationFrame(loop)
})(0);

go(0);
</script>
</body>
</html>
